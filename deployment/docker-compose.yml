services:
  db:
    image: postgres:17.4
    restart: always
    user: postgres
    volumes:
      - family-planner-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=family_planner
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
    expose:
      - 5432
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8.0.6
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongo
      - MONGO_INITDB_ROOT_PASSWORD=mongo
    volumes:
      - family-planner-mongo-data:/data/db

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=mongo
      - ME_CONFIG_MONGODB_ADMINPASSWORD=mongo
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      #- ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongo

  backend:
    image: backend:latest
    build:
      context: ../backend
    ports:
      - "8080:8080"
    depends_on:
      - "db"
      - "mongo"

volumes:
  family-planner-db-data:
  family-planner-mongo-data:
