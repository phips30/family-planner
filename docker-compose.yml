services:
  db:
    image: postgres
    restart: always
    user: postgres
    volumes:
      - family-planner-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=family-planner
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  family-planner-db-data: